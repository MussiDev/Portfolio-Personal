name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # El linter estuvo roto sin que nadie lo notara porque el CI nunca lo
      # corría: eslint.config.mjs pasaba eslint-config-next 16 (flat config
      # nativo) por FlatCompat y reventaba al arrancar. Ahora que anda, el CI
      # es quien tiene que avisar si vuelve a romperse.
      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FIRSTCAPTCHA: ${{ secrets.NEXT_PUBLIC_FIRSTCAPTCHA }}

      - name: Smoke test (canonical, sitemap, captcha gate)
        run: pnpm run smoke
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # E2E contra el build de producción que se acaba de generar: deep
      # links, formulario, axe y el presupuesto de red de mobile (que
      # three.js no se cuele por debajo de 768px). Solo chromium: lo que se
      # verifica acá es comportamiento propio, no compatibilidad entre
      # motores, y bajar tres navegadores cuesta minutos por corrida.
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E + accesibilidad
        run: pnpm run e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FIRSTCAPTCHA: ${{ secrets.NEXT_PUBLIC_FIRSTCAPTCHA }}

      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # The linter was broken without anyone noticing because CI never ran
      # it: eslint.config.mjs passed eslint-config-next 16 (native flat
      # config) through FlatCompat and crashed on startup. Now that it
      # works, CI is what has to flag it if it breaks again.
      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FIRSTCAPTCHA: ${{ secrets.NEXT_PUBLIC_FIRSTCAPTCHA }}

      - name: Smoke test (canonical, sitemap, captcha gate)
        run: pnpm run smoke
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # E2E against the production build that was just generated: deep
      # links, the form, axe and mobile's network budget (that three.js
      # doesn't sneak in below 768px). Chromium only: what's being verified
      # here is our own behavior, not cross-engine compatibility, and
      # downloading three browsers costs minutes per run.
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E + accessibility
        run: pnpm run e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FIRSTCAPTCHA: ${{ secrets.NEXT_PUBLIC_FIRSTCAPTCHA }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
